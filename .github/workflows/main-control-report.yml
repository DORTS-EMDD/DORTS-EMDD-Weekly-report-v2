name: Main baseline control report

on:
  push:
    branches:
      - validation/main-control-20261114
    paths:
      - ".github/workflows/main-control-report.yml"

permissions:
  contents: read

concurrency:
  group: main-baseline-control-report
  cancel-in-progress: false

jobs:
  main-baseline-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
      MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
      MAIAGENT_CHATBOT_ID: ${{ secrets.MAIAGENT_CHATBOT_ID }}
      MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      DEFAULT_RECIPIENTS: ${{ secrets.DEFAULT_RECIPIENTS }}
      DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
      DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
      DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
      LIVE_EMAIL_SEND: "0"
      REGION_MODE: "selected"
      PERIOD_START: "2026-11-02"
      PERIOD_END: "2026-11-08"
      MAIN_BASELINE_SHA: "6ded7d1ac3f0a4296affcf7cd67fe27f03db1120"
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BASELINE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Verify exact main baseline and required MaiAgent secrets
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$MAIN_BASELINE_SHA"
          for name in MAIAGENT_API_BASE MAIAGENT_API_KEY MAIAGENT_CHATBOT_ID MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET=$name" >&2
              exit 1
            fi
          done
      - name: Offline regression gate on main baseline
        run: python -m pytest -q
      - name: Run main baseline weekly report
        id: cli
        shell: bash
        run: |
          code=0
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
              -u http_proxy -u https_proxy -u all_proxy \
              python main.py \
                --region-mode "$REGION_MODE" \
                --period-start "$PERIOD_START" \
                --period-end "$PERIOD_END" \
                --output-dir report-output || code=$?
          if [ -f report-output/run_summary.txt ]; then
            {
              echo "## Main baseline control report"
              echo
              echo "Exact main SHA: $MAIN_BASELINE_SHA"
              echo
              echo '~~~'
              cat report-output/run_summary.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Main baseline report::Produced with disclosed technical gaps"
            exit 0
          fi
          exit "$code"
      - name: Upload main baseline report artifacts
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline-weekly-report-${{ github.run_id }}
          path: report-output/
          if-no-files-found: error
          retention-days: 90

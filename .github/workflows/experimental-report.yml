name: Experimental weekly report generation

on:
  push:
    branches:
      - validation/category-relationship-20261114
    paths:
      - ".github/workflows/experimental-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-weekly-report
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Offline regression gate
        run: python -m pytest -q

  experimental-report:
    name: Generate experimental report (unsealed, no email)
    needs: offline-regression
    if: ${{ needs.offline-regression.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
      MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
      MAIAGENT_CHATBOT_ID: ${{ secrets.MAIAGENT_CHATBOT_ID }}
      MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      DEFAULT_RECIPIENTS: ${{ secrets.DEFAULT_RECIPIENTS }}
      DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
      DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
      DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
      LIVE_EMAIL_SEND: "0"
      REGION_MODE: "selected"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Verify experimental branch and required MaiAgent secrets
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/validation/category-relationship-20261114"
          for name in MAIAGENT_API_BASE MAIAGENT_API_KEY MAIAGENT_CHATBOT_ID MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET=$name" >&2
              exit 1
            fi
          done
      - name: Run experimental weekly report
        id: cli
        shell: bash
        run: |
          code=0
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY             -u http_proxy -u https_proxy -u all_proxy             python main.py --region-mode "$REGION_MODE" --output-dir report-output || code=$?
          if [ -f report-output/run_summary.txt ]; then
            {
              echo "## Experimental report run"
              echo
              echo "UNSEALED EXPERIMENTAL OUTPUT — not release-ready"
              echo
              echo '~~~'
              cat report-output/run_summary.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Experimental weekly report::Produced with disclosed technical gaps"
            exit 0
          fi
          exit "$code"
      - name: Upload experimental report artifacts
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-weekly-report-${{ github.run_id }}
          path: report-output/
          if-no-files-found: error
          retention-days: 90

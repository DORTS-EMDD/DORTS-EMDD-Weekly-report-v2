name: Weekly-report V2 production

on:
  # RC-56: Mondays 06:30 Asia/Taipei, so the report normally arrives before
  # 08:00. Off the top of the hour, where GitHub delays scheduled runs most.
  # Only the start time lives here: the reporting week is decided once, in
  # Python (production_runner.default_period, Asia/Taipei). Inert until the
  # repository variable WEEKLY_REPORT_SCHEDULE is "enabled".
  schedule:
    - cron: "30 6 * * 1"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      period_start:
        description: "Report period start (YYYY-MM-DD); empty = Monday of the last complete Asia/Taipei week"
        required: false
        type: string
      period_end:
        description: "Report period end (YYYY-MM-DD); empty = Sunday of the last complete Asia/Taipei week"
        required: false
        type: string
      region_mode:
        description: "Configured Search region mode"
        required: true
        default: selected
        type: choice
        options:
          - selected
          - global
      run_production:
        description: "Run the full production runner after the offline gate"
        required: true
        default: false
        type: boolean
      send_email:
        description: "Email the formal report (PDF attached) to DEFAULT_RECIPIENTS"
        required: true
        default: false
        type: boolean
      release_attempted_period:
        description: "RC-55 release: the run's exact period YYYY-MM-DD..YYYY-MM-DD (empty = no release)"
        required: false
        type: string
      release_claims:
        description: "RC-55 release: <entry reference>@<run_id> claims from a run summary, comma separated"
        required: false
        type: string
      source_probe:
        description: "Observation only: probe specialist rail media hosts with EvidenceService's fetcher and structural assessment (no MaiAgent calls, no report)"
        required: false
        default: false
        type: boolean
      recall_periods:
        description: "Recall test instead of a report: START:END,START:END (YYYY-MM-DD, at most 8). Runs each period in turn, never emails"
        required: false
        type: string
      recall_wait_first:
        description: "Recall test: also wait 3600 s before the first period (queue behind a run that has just used Google News)"
        required: false
        default: false
        type: boolean
      delivery_check:
        description: "RC-55 live check instead of a report: l1-l2 (ledger), l3 (one email to the sending account)"
        required: true
        default: none
        type: choice
        options:
          - none
          - l1-l2
          - l3

permissions:
  contents: read

# One production or recall-test job at a time, in one shared group declared on
# those two jobs (RC-73). It is not declared on the workflow, so jobs that never
# touch Google News or MaiAgent (source-probe, delivery-check, the offline gate,
# the recall plan) do not queue behind a long recall test. RC-55: the delivery
# ledger (a private repository written by compare-and-swap) does not rely on this.

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Offline regression gate
        run: python -m pytest -q

  production:
    concurrency:
      group: weekly-report-production
      cancel-in-progress: false
    needs: offline-regression
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_production == true) || (github.event_name == 'schedule' && vars.WEEKLY_REPORT_SCHEDULE == 'enabled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Google News RSS six-probe health check
        run: python -m scripts.google_news_health_check
      - name: Run shared production CLI
        id: cli
        run: |
          args=(--region-mode "$REGION_MODE" --output-dir report-output)
          if [ -n "$PERIOD_START" ]; then args+=(--period-start "$PERIOD_START"); fi
          if [ -n "$PERIOD_END" ]; then args+=(--period-end "$PERIOD_END"); fi
          code=0
          python main.py "${args[@]}" || code=$?
          if [ -f report-output/run_summary.txt ]; then
            { echo '```'; cat report-output/run_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Exit 2 = report produced and delivered with disclosed technical gaps
          # (SUCCESS_WITH_TECHNICAL_GAPS): a warning, not a complete success and
          # not a failed run. Exit 1 (configuration, application, PDF or
          # delivery failure) still fails the job.
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Weekly report::Produced with disclosed technical gaps (SUCCESS_WITH_TECHNICAL_GAPS); see the step summary"
            exit 0
          fi
          exit "$code"
        env:
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
          REGION_MODE: ${{ inputs.region_mode || 'selected' }}
          MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
          MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
          MAIAGENT_CHATBOT_ID: ${{ secrets.MAIAGENT_CHATBOT_ID }}
          MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DEFAULT_RECIPIENTS: ${{ secrets.DEFAULT_RECIPIENTS }}
          # Email only on an explicit opt-in: the dispatch input, or the
          # repository variable LIVE_EMAIL_SEND=1 for scheduled runs.
          LIVE_EMAIL_SEND: ${{ ((github.event_name == 'workflow_dispatch' && inputs.send_email == true) || (github.event_name == 'schedule' && vars.LIVE_EMAIL_SEND == '1')) && '1' || '0' }}
          # RC-55 (contract section A.39): the per-recipient handoff ledger in
          # the private repository. Live email fails closed without all three.
          DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
          DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
          DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
          # An authorized release of named ATTEMPTED claims; manual runs only
          # (Delivery refuses a release on a scheduled run).
          DELIVERY_RELEASE_PERIOD: ${{ inputs.release_attempted_period }}
          DELIVERY_RELEASE_CLAIMS: ${{ inputs.release_claims }}
      - name: Echo the formal report and its event outcomes to the job log
        # Observation only: lets a reviewer without artifact download access
        # read the report and each Event Group's terminal stage from the log.
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        run: |
          for f in report-output/weekly-report-*.md; do [ -f "$f" ] && cat "$f"; done
          if [ -f report-output/selection_audit.json ]; then
            python -c "import json; a=json.load(open('report-output/selection_audit.json', encoding='utf-8')); c={x['candidate_id']: x for x in a['candidates']}; [print('EVENT', e['terminal_stage'], e['terminal_reason'], (e.get('category') or {}).get('primary_category'), '|', ' || '.join(c[m]['discovery_title'][:80] for m in e['member_candidate_ids'])) for e in a['events']]"
          fi
      - name: Keep the formal report, run summary and selection audit
        # Only after the CLI actually ran: never after a failed health gate.
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: report-output/
          if-no-files-found: warn
          retention-days: 90

  recall-plan:
    # Orchestration only: validates recall_periods and builds the matrix.
    needs: offline-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recall_periods != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the period matrix
        id: plan
        run: python -m scripts.recall_matrix
        env:
          RECALL_PERIODS: ${{ inputs.recall_periods }}

  recall-test:
    # Recall test: the same production CLI over past periods, one after the
    # other, entirely on GitHub Actions. It can never send email: the job pins
    # LIVE_EMAIL_SEND to 0 and is given no SMTP, recipient or delivery-ledger
    # secret. Each period is independent (fail-fast off).
    concurrency:
      group: weekly-report-production
      cancel-in-progress: false
    needs: recall-plan
    if: ${{ needs.recall-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      # The placeholder only keeps the matrix valid when recall-plan was skipped.
      matrix: ${{ fromJSON(needs.recall-plan.outputs.matrix || '{"include":[{"start":"","end":""}]}') }}
    name: recall ${{ matrix.start }}..${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Wait one hour so Google News does not rate-limit consecutive periods
        # Every period after the first; the first too when recall_wait_first is set.
        if: ${{ strategy.job-index != 0 || inputs.recall_wait_first == true }}
        run: sleep 3600
      - name: Google News RSS six-probe health check (RC-72 rule, one 45-minute retry)
        run: python -m scripts.google_news_health_check
      - name: Run shared production CLI for this period
        id: cli
        run: |
          code=0
          python main.py --region-mode "$REGION_MODE" --output-dir report-output \
            --period-start "$PERIOD_START" --period-end "$PERIOD_END" || code=$?
          if [ -f report-output/run_summary.txt ]; then
            { echo '```'; cat report-output/run_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Exit 2 = produced with disclosed technical gaps: a warning, as in production.
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Recall test::Produced with disclosed technical gaps (SUCCESS_WITH_TECHNICAL_GAPS)"
            exit 0
          fi
          exit "$code"
        env:
          PERIOD_START: ${{ matrix.start }}
          PERIOD_END: ${{ matrix.end }}
          REGION_MODE: ${{ inputs.region_mode || 'selected' }}
          MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
          MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
          MAIAGENT_CHATBOT_ID: ${{ secrets.MAIAGENT_CHATBOT_ID }}
          MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
          LIVE_EMAIL_SEND: "0"
      - name: Print the report and every candidate to the job log
        # Observation only, for readers who cannot download the artifact.
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        run: |
          echo "===== REPORT MARKDOWN ====="
          for f in report-output/weekly-report-*.md; do [ -f "$f" ] && cat "$f"; done
          echo "===== CANDIDATES (title, publisher, final stage, reason, category) ====="
          python -m scripts.recall_candidates report-output/selection_audit.json
      - name: Keep the report, run summary and selection audit
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: recall-${{ matrix.start }}_${{ matrix.end }}-${{ github.run_id }}
          path: report-output/
          if-no-files-found: warn
          retention-days: 30

  source-probe:
    # Observation only: prints fetch status, the production structural
    # assessment and the page HTML (gzip+base64) of specialist rail media
    # hosts, so their Evidence failures can be reproduced offline.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_probe == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      # RC-88 (observation only): where does Google News RSS drop trailing
      # query words? Per language, dates last over a past week, and whether a
      # last OR term is still used with the dates first (about 29 requests).
      - name: Probe Google News query length
        run: python -m scripts.query_length_probe --characters
      - name: Probe specialist rail media hosts
        run: python -m scripts.source_host_probe --dump
      # RC-87 (observation only): canonical declarations of the pages
      # of recall Run 45558738725 under the d5bfbaa, RC-86 and RC-86 prefix rules.
      - name: Probe canonical declarations of Run 45558738725 pages
        run: python -m scripts.canonical_declaration_probe acceptance/canonical_probe/run_45558738725_pages.tsv

  delivery-check:
    # RC-55 live checks (L1-L3): manual only, never on the schedule, and never
    # a weekly report. l1-l2 writes synthetic entries to the ledger; l3 sends
    # one message to the sending account and only through the Delivery owner.
    needs: offline-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_check != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: RC-55 live check
        run: python -m scripts.delivery_ledger_checks "$DELIVERY_CHECK"
        env:
          DELIVERY_CHECK: ${{ inputs.delivery_check }}
          DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
          DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
          DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}

name: Weekly-report V2 production

on:
  # RC-56: Mondays 06:30 Asia/Taipei, so the report normally arrives before
  # 08:00. Off the top of the hour, where GitHub delays scheduled runs most.
  # Only the start time lives here: the reporting week is decided once, in
  # Python (production_runner.default_period, Asia/Taipei). Inert until the
  # repository variable WEEKLY_REPORT_SCHEDULE is "enabled".
  schedule:
    - cron: "30 6 * * 1"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      period_start:
        description: "Report period start (YYYY-MM-DD); empty = Monday of the last complete Asia/Taipei week"
        required: false
        type: string
      period_end:
        description: "Report period end (YYYY-MM-DD); empty = Sunday of the last complete Asia/Taipei week"
        required: false
        type: string
      region_mode:
        description: "Configured Search region mode"
        required: true
        default: selected
        type: choice
        options:
          - selected
          - global
      run_production:
        description: "Run the formal Category seal, then production only after a PASS"
        required: true
        default: false
        type: boolean
      run_relationship_bounded:
        description: "Temporary validation only: run the 14-case relationship-aware Category bounded gate"
        required: true
        default: false
        type: boolean
      send_email:
        description: "Email the formal report (PDF attached) to DEFAULT_RECIPIENTS"
        required: true
        default: false
        type: boolean
      release_attempted_period:
        description: "RC-55 release: the run's exact period YYYY-MM-DD..YYYY-MM-DD (empty = no release)"
        required: false
        type: string
      release_claims:
        description: "RC-55 release: <entry reference>@<run_id> claims from a run summary, comma separated"
        required: false
        type: string
      delivery_check:
        description: "RC-55 live check instead of a report: l1-l2 (ledger), l3 (one email to the sending account)"
        required: true
        default: none
        type: choice
        options:
          - none
          - l1-l2
          - l3

permissions:
  contents: read

# One production run at a time. RC-55: the delivery ledger (a private
# repository written by compare-and-swap) does not rely on this.
concurrency:
  group: weekly-report-production
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Offline regression gate
        run: python -m pytest -q

  formal_category_seal:
    name: Fresh formal Category seal
    needs: offline-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
      MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
      MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify selected release ref
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/release/report-quality-wip"
      - name: Enforce email-disabled release validation
        env:
          REQUESTED_SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          if [ "$REQUESTED_SEND_EMAIL" != "false" ]; then
            echo "RELEASE_VALIDATION_REQUIRES_SEND_EMAIL_FALSE" >&2
            exit 1
          fi
      - name: Verify required MaiAgent secrets are present
        shell: bash
        run: |
          for name in MAIAGENT_API_BASE MAIAGENT_API_KEY MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET=$name" >&2
              exit 1
            fi
          done
      - name: Run fresh production-bound formal Category seal
        run: |
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python scripts/category_formal_v7_seal.py
      - name: Preserve formal Category seal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: category-formal-seal-${{ github.run_id }}
          path: docs/category-v4-final-seal/
          if-no-files-found: warn
          retention-days: 90

  bounded_category_relationship:
    name: Temporary relationship-aware Category bounded acceptance
    needs: offline-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_relationship_bounded == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
      MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
      MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify temporary validation ref
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/validation/category-relationship-20261114"
      - name: Verify required MaiAgent secrets are present
        shell: bash
        run: |
          for name in MAIAGENT_API_BASE MAIAGENT_API_KEY MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET=$name" >&2
              exit 1
            fi
          done
      - name: Run 42-call relationship-aware Category bounded acceptance
        run: |
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            python scripts/category_bounded_live_acceptance.py
      - name: Preserve bounded Category evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: category-relationship-bounded-${{ github.run_id }}
          path: acceptance/category_relationship_contract_20261114/bounded/
          if-no-files-found: warn
          retention-days: 90

  production:
    needs:
      - offline-regression
      - formal_category_seal
    if: ${{ always() && needs.offline-regression.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.run_production == true && needs.formal_category_seal.result == 'success') || (github.event_name == 'schedule' && vars.WEEKLY_REPORT_SCHEDULE == 'enabled' && needs.formal_category_seal.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: Google News RSS six-probe health check
        run: python -m scripts.google_news_health_check
      - name: Confirm email delivery is disabled for release validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production == true }}
        env:
          LIVE_EMAIL_SEND: ${{ ((github.event_name == 'workflow_dispatch' && inputs.send_email == true) || (github.event_name == 'schedule' && vars.LIVE_EMAIL_SEND == '1')) && '1' || '0' }}
        run: test "$LIVE_EMAIL_SEND" = "0"
      - name: Run shared production CLI
        id: cli
        run: |
          args=(--region-mode "$REGION_MODE" --output-dir report-output)
          if [ -n "$PERIOD_START" ]; then args+=(--period-start "$PERIOD_START"); fi
          if [ -n "$PERIOD_END" ]; then args+=(--period-end "$PERIOD_END"); fi
          code=0
          python main.py "${args[@]}" || code=$?
          if [ -f report-output/run_summary.txt ]; then
            { echo '```'; cat report-output/run_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Exit 2 = report produced and delivered with disclosed technical gaps
          # (SUCCESS_WITH_TECHNICAL_GAPS): a warning, not a complete success and
          # not a failed run. Exit 1 (configuration, application, PDF or
          # delivery failure) still fails the job.
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Weekly report::Produced with disclosed technical gaps (SUCCESS_WITH_TECHNICAL_GAPS); see the step summary"
            exit 0
          fi
          exit "$code"
        env:
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
          REGION_MODE: ${{ inputs.region_mode || 'selected' }}
          MAIAGENT_API_BASE: ${{ secrets.MAIAGENT_API_BASE }}
          MAIAGENT_API_KEY: ${{ secrets.MAIAGENT_API_KEY }}
          MAIAGENT_CHATBOT_ID: ${{ secrets.MAIAGENT_CHATBOT_ID }}
          MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID: ${{ secrets.MAIAGENT_STRUCTURED_HELPER_CHATBOT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DEFAULT_RECIPIENTS: ${{ secrets.DEFAULT_RECIPIENTS }}
          # Email only on an explicit opt-in: the dispatch input, or the
          # repository variable LIVE_EMAIL_SEND=1 for scheduled runs.
          LIVE_EMAIL_SEND: ${{ ((github.event_name == 'workflow_dispatch' && inputs.send_email == true) || (github.event_name == 'schedule' && vars.LIVE_EMAIL_SEND == '1')) && '1' || '0' }}
          # RC-55 (contract section A.39): the per-recipient handoff ledger in
          # the private repository. Live email fails closed without all three.
          DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
          DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
          DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
          # An authorized release of named ATTEMPTED claims; manual runs only
          # (Delivery refuses a release on a scheduled run).
          DELIVERY_RELEASE_PERIOD: ${{ inputs.release_attempted_period }}
          DELIVERY_RELEASE_CLAIMS: ${{ inputs.release_claims }}
      - name: Keep the formal report, run summary and selection audit
        # Only after the CLI actually ran: never after a failed health gate.
        if: ${{ !cancelled() && steps.cli.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: report-output/
          if-no-files-found: warn
          retention-days: 90

  delivery-check:
    # RC-55 live checks (L1-L3): manual only, never on the schedule, and never
    # a weekly report. l1-l2 writes synthetic entries to the ledger; l3 sends
    # one message to the sending account and only through the Delivery owner.
    needs: offline-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_check != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the embedded PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: RC-55 live check
        run: python -m scripts.delivery_ledger_checks "$DELIVERY_CHECK"
        env:
          DELIVERY_CHECK: ${{ inputs.delivery_check }}
          DELIVERY_LEDGER_REPOSITORY: ${{ secrets.DELIVERY_LEDGER_REPOSITORY }}
          DELIVERY_LEDGER_TOKEN: ${{ secrets.DELIVERY_LEDGER_TOKEN }}
          DELIVERY_LEDGER_KEY: ${{ secrets.DELIVERY_LEDGER_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
